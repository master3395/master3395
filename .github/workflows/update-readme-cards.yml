# Generates github-readme-stats SVGs into profile/ (no external Vercel dependency).
# Requires repo secret README_STATS_PAT (classic PAT: repo + read:user).
# See: https://github.com/stats-organization/github-readme-stats-action

name: Update README cards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-readme-cards.yml"
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: readme-cards
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require README_STATS_PAT
        env:
          README_STATS_PAT: ${{ secrets.README_STATS_PAT }}
        run: |
          if [ -z "$README_STATS_PAT" ]; then
            echo "::error::Missing secret README_STATS_PAT (classic PAT with repo + read:user)."
            exit 1
          fi

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&count_private=true&include_all_commits=true&show_icons=true&theme=dark&icon_color=fff&hide_border=true"
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_PAT }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&count_private=true&include_all_commits=true&show_icons=true&theme=dark&icon_color=fff&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_PAT }}
          fail_on_error: true

      - name: Reject error SVGs
        run: |
          for f in profile/stats.svg profile/top-langs.svg; do
            if grep -q "Something went wrong" "$f"; then
              echo "::error::$f still contains an error card"
              exit 1
            fi
          done

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: update README stat cards"
          git push
